<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#2e2a8f">
<title>Hero Bill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3f8;--card:#fff;--ink:#1d1b3a;--ink2:#55536e;--ink3:#8e8ca4;--line:#e6e4ef;--line2:#d6d3e4;
  --brand:#2e2a8f;--brand2:#4b46b8;--brandSoft:#eeedfb;--ok:#2f7d5b;--okSoft:#e7f4ee;--warn:#9a6a12;--warnSoft:#fdf4e2;--warnLine:#f0d9a8;--bad:#a63d3d;--badSoft:#fbecec;--wa:#1fa855}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;height:100%}
body{font-family:'Ubuntu','Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
.bn{font-family:'Hind Siliguri','Noto Sans Bengali','Ubuntu',sans-serif}
.en{font-size:.82em;color:var(--ink3);font-weight:400}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:600px){body{background:#e9e8f1}.app{box-shadow:0 0 40px rgba(29,27,58,.08)}}
/* header */
.hdr{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px}
.hdr .lg{width:36px;height:36px;border-radius:10px;background:#fff;padding:4px;flex:none}
.hdr .lg img{width:100%;height:100%;object-fit:contain}
.hdr .tt{flex:1;min-width:0;line-height:1.2}
.hdr .tt b{font-size:16.5px;display:block}
.hdr .tt small{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.hbtn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.hbtn:active{background:rgba(255,255,255,.25)}
.body{flex:1;padding:14px 14px 120px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 1px 2px rgba(29,27,58,.04),0 6px 18px rgba(29,27,58,.05)}
.sec-t{font-size:13px;color:var(--ink3);margin:18px 4px 8px;font-weight:500}
/* buttons */
.btn{border:0;border-radius:14px;min-height:50px;padding:0 18px;cursor:pointer;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:#fff;border:1.5px solid var(--line2);color:var(--ink)}
.btn.soft{background:var(--brandSoft);color:var(--brand)}
.btn.okb{background:var(--ok);color:#fff}
.btn.wa{background:var(--wa);color:#fff}
.btn.danger{background:#fff;border:1.5px solid #e9c3c3;color:var(--bad)}
.btn.sm{min-height:40px;font-size:14px;border-radius:11px;padding:0 12px;width:auto}
.btn:disabled{opacity:.45}
.btn .en{color:inherit;opacity:.8}
.btn{flex-wrap:wrap;column-gap:6px;row-gap:0;line-height:1.2;text-align:center}
.btn .bn,.btn .en{white-space:nowrap}
.link{background:none;border:0;color:var(--brand);font-weight:500;cursor:pointer;padding:6px;font-size:14px}
/* welcome / setup */
.hero-top{background:var(--brand);color:#fff;padding:calc(36px + env(safe-area-inset-top)) 22px 70px;text-align:center;position:relative;overflow:hidden}
.hero-top:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:30px solid rgba(255,255,255,.06)}
.hero-top .lg{width:76px;height:76px;margin:0 auto;border-radius:20px;background:#fff;padding:8px}
.hero-top .lg img{width:100%;height:100%;object-fit:contain}
.hero-top h1{margin:14px 0 2px;font-size:25px}
.hero-top p{margin:0;opacity:.85;font-size:14px}
.float{margin:-46px 14px 0;position:relative;z-index:2;padding:20px}
.float h2{margin:0 0 4px;font-size:18px}
.float .lead{margin:0 0 16px;color:var(--ink2);font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.err{color:var(--bad);font-size:13.5px;min-height:18px}
textarea.code{width:100%;min-height:120px;border:1.5px solid var(--line2);border-radius:12px;padding:10px;font-size:13px;font-family:ui-monospace,monospace}
/* hero picker */
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;text-align:left;width:100%}
.pitem:active{background:#f6f5fb}
.av{width:44px;height:44px;border-radius:14px;background:var(--brandSoft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.pitem b{display:block;font-size:15.5px}.pitem small{color:var(--ink3)}
/* pin */
.pinwrap{text-align:center;padding:24px 18px}
.pinwrap .av{width:64px;height:64px;font-size:22px;margin:0 auto 8px;border-radius:20px}
.dots{display:flex;gap:14px;justify-content:center;margin:20px 0 6px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--brand2);transition:.15s}
.dots i.f{background:var(--brand);border-color:var(--brand);transform:scale(1.1)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:16px auto 0}
.pad button{height:62px;border-radius:18px;border:0;background:#fff;box-shadow:0 1px 0 var(--line2),0 2px 8px rgba(29,27,58,.06);font-size:24px;font-weight:500;cursor:pointer}
.pad button:active{background:var(--brandSoft)}
.pad button.fn{background:none;box-shadow:none;font-size:15px;color:var(--ink2)}
/* home */
.greet{padding:18px;display:flex;align-items:center;gap:14px}
.greet .av{width:52px;height:52px;font-size:19px;border-radius:16px}
.greet h2{margin:0;font-size:18px}.greet p{margin:2px 0 0;color:var(--ink3);font-size:13.5px}
.today{margin-top:12px;padding:18px;position:relative;overflow:hidden}
.today .lbl{font-size:13px;color:var(--ink3)}
.today .big{font-size:20px;font-weight:700;margin:2px 0 12px}
.today.sent{background:linear-gradient(0deg,#fff,#fff) padding-box;border-color:#c5e4d4}
.today .st{position:absolute;right:16px;top:16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 10px;border-radius:999px;font-weight:500;white-space:nowrap}
.chip.draft{background:var(--warnSoft);color:var(--warn)}.chip.sent{background:var(--okSoft);color:var(--ok)}.chip.changed{background:var(--badSoft);color:var(--bad)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{padding:14px}.stat .v{font-size:20px;font-weight:700}.stat .l{font-size:12.5px;color:var(--ink3)}
.hist{display:flex;flex-direction:column;gap:8px}
.hitem{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px}
.hitem:active{background:#f8f7fc}
.hitem .dt{width:46px;text-align:center;flex:none;line-height:1.1}
.hitem .dt b{font-size:19px;display:block}.hitem .dt small{font-size:11px;color:var(--ink3)}
.hitem .mid{flex:1;min-width:0}.hitem .mid b{font-size:14.5px}.hitem .mid small{display:block;color:var(--ink3);font-size:12.5px}
.hitem .amt{text-align:right;font-weight:700}
/* editor */
.ebar{padding:14px;display:flex;flex-direction:column;gap:12px}
.row2{display:flex;gap:10px;align-items:center}
.lab{font-size:13px;color:var(--ink2);font-weight:500;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.c{border:1.5px solid var(--line2);background:#fff;border-radius:12px;min-height:44px;padding:6px 14px;cursor:pointer;font-size:15px;text-align:left;line-height:1.2}
.c small{display:block;font-size:11.5px;color:var(--ink3)}
.c.on{border-color:var(--brand);background:var(--brandSoft);color:var(--brand);font-weight:600}
.c.on small{color:var(--brand2)}
.c.dashed{border-style:dashed;color:var(--ink2)}
.dinput{height:46px;border:1.5px solid var(--line2);border-radius:12px;padding:0 12px;background:#fff;flex:1;min-width:0}
.trips{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.trip{padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.trip .ic{width:42px;height:42px;border-radius:12px;background:#f4f3fa;display:grid;place-items:center;font-size:22px;flex:none}
.trip .mid{flex:1;min-width:0}
.trip .route{font-weight:600;font-size:15.5px;line-height:1.3}
.trip .meta{font-size:12.5px;color:var(--ink3);margin-top:1px}
.trip .why{font-size:12.5px;color:var(--warn);margin-top:3px}
.trip .r{text-align:right;flex:none}
.trip .amt{font-weight:700;font-size:17px}
.trip .ch{font-size:12px;color:#a8a6ba}
.trip .over{display:inline-block;font-size:11.5px;color:var(--bad);background:var(--badSoft);border-radius:6px;padding:1px 6px;margin-top:3px}
.trip.warn{border-color:var(--warnLine)}
.tacts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tacts button{border:1px solid var(--line2);background:#fff;border-radius:9px;height:32px;padding:0 10px;font-size:13px;cursor:pointer;color:var(--ink2)}
.tacts button:active{background:var(--brandSoft)}
.emptyt{text-align:center;padding:30px 16px;color:var(--ink3)}
.emptyt .e{font-size:44px}
.addrow{display:grid;grid-template-columns:1.5fr 1fr;gap:10px;margin-top:14px}
.addrow .btn{min-height:58px;font-size:15.5px;flex-direction:column;gap:0;line-height:1.2}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:25;pointer-events:none}
.foot .in{max-width:560px;margin:0 auto;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;pointer-events:auto;box-shadow:0 -8px 24px rgba(29,27,58,.06)}
.foot .tot{flex:none;line-height:1.15}.foot .tot small{display:block;font-size:12px;color:var(--ink3)}.foot .tot b{font-size:22px}
.foot .btn{flex:1}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(29,27,58,.38);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;max-height:94vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:translateY(0)}
.sheet .sh{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet .sh:before{content:"";position:absolute;left:50%;top:6px;width:40px;height:4px;border-radius:4px;background:var(--line2);transform:translateX(-50%)}
.sheet .sh h3{margin:0;font-size:17px;flex:1}
.sheet .sx{border:0;background:#f1f0f7;width:36px;height:36px;border-radius:11px;font-size:20px;cursor:pointer;color:var(--ink2)}
.sheet .sb{padding:14px 16px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.sheet .sf{padding:10px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{border:1.5px solid var(--line2);background:#fff;border-radius:14px;padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;line-height:1.15}
.mode .e{font-size:26px}.mode small{font-size:11px;color:var(--ink3)}
.mode.on{border-color:var(--brand);background:var(--brandSoft);color:var(--brand);font-weight:600}
.wz{display:flex;gap:4px;margin:-2px 0 2px}
.wzs{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0;cursor:pointer;color:var(--ink3);font-size:11.5px;min-width:0}
.wzs i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#f1f0f7;color:var(--ink3);font-weight:700;font-size:13px;position:relative}
.wzs:not(:first-child) i:before{content:"";position:absolute;right:calc(100% + 2px);top:50%;width:calc(100vw);max-width:60px;height:2px;background:var(--line);z-index:-1}
.wzs.done i{background:var(--okSoft);color:var(--ok)}.wzs.cur i{background:var(--brand);color:#fff;box-shadow:0 0 0 4px var(--brandSoft)}.wzs.cur{color:var(--brand);font-weight:600}
.wzs:disabled{opacity:.5;cursor:default}
.wzsum{background:#f8f7fc;border-radius:12px;padding:9px 12px;font-size:14.5px;text-align:center;line-height:1.35}
.plist2{display:flex;flex-direction:column;gap:6px}
.pl{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--line2);background:#fff;border-radius:12px;min-height:50px;padding:6px 14px;cursor:pointer;font-size:15.5px;text-align:left;width:100%}
.pl:active{background:#f6f5fb}.pl b{font-size:14px;color:var(--ink2);flex:none}.pl small{flex:none}
.pl.on{border-color:var(--brand);background:var(--brandSoft);color:var(--brand);font-weight:600}.pl.on b{color:var(--brand)}
.pl.dashed{border-style:dashed;color:var(--ink2);justify-content:flex-start;margin-top:4px}
.srch{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line2);border-radius:12px;padding:0 12px;background:#fff;position:sticky;top:-14px;z-index:2}
.srch input{border:0;outline:0;height:46px;flex:1;min-width:0;font-size:15px;background:none}
.srch:focus-within{border-color:var(--brand2)}
.otherbox{display:flex;gap:8px;margin-top:4px}.otherbox .txt{flex:1}
.sheet .sf .btn{width:auto;flex:1}
.fare{display:flex;align-items:stretch;gap:10px}
.fare .in{flex:1;display:flex;align-items:center;border:2px solid var(--line2);border-radius:14px;padding:0 14px;background:#fff}
.fare .in:focus-within{border-color:var(--brand2)}
.fare .in span{font-size:22px;color:var(--ink3);margin-right:6px}
.fare input{border:0;outline:0;font-size:28px;font-weight:700;width:100%;height:60px;background:none}
.fare .chartbox{flex:none;width:118px;border-radius:14px;background:#f4f3f7;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#9d9bb0;text-align:center;padding:6px}
.fare .chartbox b{font-size:21px;color:#8e8ca4}.fare .chartbox small{font-size:11.5px}
.fwarn{border-radius:12px;padding:10px 12px;font-size:13.5px;display:flex;gap:8px;align-items:flex-start}
.fwarn.over{background:var(--badSoft);color:#7a2a2a}.fwarn.none{background:var(--warnSoft);color:#5d4206}.fwarn.ok{background:var(--okSoft);color:#1f5a40}
.txt{width:100%;height:48px;border:1.5px solid var(--line2);border-radius:12px;padding:0 12px;background:#fff;font-size:15px}
.txt:focus,.dinput:focus{outline:none;border-color:var(--brand2)}
/* share */
.done{text-align:center;padding:6px 0 4px}
.tick{width:74px;height:74px;border-radius:50%;background:var(--ok);margin:0 auto;display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.tick svg{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .4s .25s forwards}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.conf{position:relative;height:0}
.conf i{position:absolute;left:50%;top:-40px;width:7px;height:7px;border-radius:2px;opacity:0;animation:conf 1s ease-out forwards}
@keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(320deg)}}
.done h3{margin:12px 0 2px;font-size:20px}.done p{margin:0;color:var(--ink2);font-size:14px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sgrid .btn{min-height:64px;flex-direction:column;gap:2px;font-size:15px;line-height:1.15}
.sgrid .btn .e{font-size:22px}
.sgrid .full{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;z-index:90;pointer-events:none;max-width:calc(100% - 30px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.menu{position:absolute;right:12px;top:calc(56px + env(safe-area-inset-top));background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 12px 36px rgba(29,27,58,.2);padding:6px;min-width:230px;z-index:40}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;font-size:14.5px}
.menu button:active{background:#f4f3fa}
.foottxt{text-align:center;font-size:11px;color:var(--ink3);margin-top:22px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;padding:10px 4px 2px;font-size:13.5px;color:var(--ink2)}
.mhead b{color:var(--ink)}
.hint2{font-size:12.5px;color:var(--ink3);text-align:center;margin-top:8px}
.fabw{position:fixed;left:0;right:0;bottom:0;pointer-events:none;z-index:24}
.fabw .fab2{pointer-events:auto;position:absolute;right:max(16px,calc((100vw - 560px)/2 + 16px));bottom:calc(18px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;border:0;border-radius:20px;background:var(--brand);color:#fff;padding:10px 18px 10px 12px;box-shadow:0 10px 26px rgba(46,42,143,.38);cursor:pointer}
.fab2:active{transform:scale(.97)}
.fab2 .pl2{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:22px;font-weight:700}
.fab2 .fl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}.fab2 .fl .bn{font-size:15.5px;font-weight:600}.fab2 small{font-size:11px;opacity:.8}
.sumrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.sumrow:last-child{border:0}
.kmrow .req{color:#d23c3c}.kmrow.need{border:1.5px solid #d23c3c;background:#fff5f5}.kmrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:10px 12px;border:1px dashed var(--line2,#dcdbe8);border-radius:12px;font-size:14px}
.kmin{display:flex;align-items:center;gap:6px}.kmin input{width:90px;height:40px;border:1px solid var(--line2,#dcdbe8);border-radius:10px;padding:0 10px;font:inherit;font-size:16px;text-align:right}
.xmbar{margin:2px 0 10px}.xml{font-size:13px;color:var(--ink2,#4a4766)}.xmchips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px;scrollbar-width:none}
.xmc{flex:none;border:1px solid var(--line2,#dcdbe8);background:#fff;border-radius:20px;padding:7px 12px;font:inherit;font-size:13.5px;white-space:nowrap}.xmc.on{background:var(--brand,#2e2a8f);color:#fff;border-color:var(--brand,#2e2a8f)}.xmc small{opacity:.75}
.xmh{margin:12px 2px 6px;font-size:13px;color:var(--ink2,#4a4766)}.xmk{display:block;font-size:11.5px;color:var(--ink3,#8e8ca4);font-weight:400}
.bigopt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px 16px;margin-top:12px;border:1.5px solid transparent;cursor:pointer;font:inherit;position:relative;overflow:hidden}
.bigopt:active{transform:scale(.99)}.bigopt.tg{background:linear-gradient(135deg,#fff,#eefaf3);border-color:#cdebdc}.bigopt.bl{background:linear-gradient(135deg,#fff,#efeefb);border-color:#dddbf3}
.boi{font-size:30px;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:#fff;box-shadow:0 2px 10px #0000000f;flex:none}
.bot{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.bot b{font-size:19px}.bot small{color:var(--ink3,#8e8ca4);font-size:12.5px}

/* base64url */
function b64u(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}

/* compact code: HB1.<deflate-raw base64url> (fallback HB0.<base64url json>) */
async function packCode(obj,prefix){
  prefix=prefix||'HB';const raw=new TextEncoder().encode(JSON.stringify(obj));
  try{if(typeof CompressionStream!=='undefined'){const z=await streamBytes(raw,CompressionStream,'deflate-raw');return prefix+'1.'+b64u(z)}}catch(e){}
  return prefix+'0.'+b64u(raw);
}
async function unpackCode(code){
  const m=String(code).trim().match(/^([A-Z]{2,3})([01])\.([A-Za-z0-9_-]+)$/);if(!m)throw new Error('Not a valid code');

  if(dh.length){await delMany('heroes',dh.map(h=>h.id));S.heroes=S.heroes.filter(h=>!OLD_DEMO_HEROES.includes(h.id));n+=dh.length;
    const keys=new Set(OLD_DEMO_FARES.map(f=>f.join('|')));const df=S.fares.filter(f=>keys.has([f.route,f.market,f.from,f.to,f.fare,f.updated].join('|')));
    if(df.length){await delMany('fares',df.map(f=>f.id));const ids=new Set(df.map(f=>f.id));S.fares=S.fares.filter(f=>!ids.has(f.id));n+=df.length}
    if(S.cfg.mgrPhone==='+8801700000000'){S.cfg.mgrPhone='';await setKV('cfg',S.cfg)}}
  try{const T=await getKV('ctTargets')||{},C=await getKV('ctColl')||{};let c=0;
    for(const [d,x] of Object.entries(T))if(x&&x.sample){delete T[d];delete C[d];c++}
    if(c){await setKV('ctTargets',T);await setKV('ctColl',C);n+=c}}catch(e){}
  try{const reps=await rwAll('reports');const bad=reps.filter(r=>r.sample);
    if(bad.length){const d=await rwDB();await new Promise((res,rej)=>{const t=d.transaction('reports','readwrite');bad.forEach(r=>t.objectStore('reports').delete(r.id));t.oncomplete=res;t.onerror=()=>rej(t.error)});d.close();n+=bad.length}}catch(e){}
  return n}
</script>

/* ===== storage ===== */
const KEY='herobill_app_v1';let MEM=null,STORE_OK=true;
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):{}}catch(e){STORE_OK=false;return MEM||{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){STORE_OK=false;MEM=D}}
let D=purgeDemoHero(load());D.bills=D.bills||[];if(D._purged){delete D._purged;save()}else delete D._purged;
/* ===== helpers ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const L=(bn,en)=>`<span class="bn">${bn}</span> <span class="en">(${en})</span>`;
const fmt=n=>(n||0).toLocaleString('en-US');const tk=n=>'৳ '+fmt(n);
const iso=d=>{const x=new Date(d);return new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const todayISO=()=>iso(new Date());
const bnDate=s=>new Date(s+'T00:00:00').toLocaleDateString('bn-BD',{day:'numeric',month:'long'});
const enDate=s=>new Date(s+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
const dayNum=s=>new Date(s+'T00:00:00').getDate();
const monShort=s=>new Date(s+'T00:00:00').toLocaleDateString('en-GB',{month:'short'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const natCmp=(a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true,sensitivity:'base'});
const firstName=n=>{const w=String(n||'').replace(/^(md\.?|mohammad|mohammed|mst\.?|mr\.?)\s+/i,'').trim().split(/\s+/);return w[0]||n};
const initials=n=>String(n||'?').replace(/^(md\.?|mohammad|mohammed|mst\.?)\s+/i,'').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
function toast(m){const t=$('toast');t.innerHTML=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2600)}
function vibe(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
const ME=()=>D.setup&&D.setup.heroes.find(h=>h.id===D.heroId);
/* ===== fare chart ===== */
let FIDX=new Map();
function indexFares(){FIDX=new Map();FRT=new Map();if(!D.setup)return;for(const [r,m,f,t,a] of D.setup.fares){FIDX.set(fareKey(r,m,f,t),a);FRT.set(fareKey(r,'',f,t),a)}}
let FRT=new Map(); /* route|from|to in any market (trips between markets) */
const chart=(r,m,f,t)=>{let v=FIDX.get(fareKey(r,m,f,t));if(v==null)v=FRT.get(fareKey(r,'',f,t));return v==null?null:v};
/* distance memory: what this hero typed last time, else the manager's value from setup */
const kmKey=(r,f,t)=>[r,f,t].map(normKey).join('|');
function kmGuess(r,f,t){if(!f||!t)return null;const k=kmKey(r,f,t);const mem=(D.kmMem||{})[k];if(mem>0)return mem;
  const s=(D.setup&&D.setup.km||[]).find(x=>kmKey(x[0],x[1],x[2])===k);return s&&s[3]>0?s[3]:null}
function myRoutes(){const me=ME();const all=[...new Set(D.setup.fares.map(x=>x[0]))].sort(natCmp);return me&&me.routes&&me.routes.length?all.filter(r=>me.routes.includes(r)):all}
function markets(route){return [...new Set(D.setup.fares.filter(x=>x[0]===route).map(x=>x[1]))].sort(natCmp)}
function locs(route,market){const s=new Set();D.setup.fares.forEach(x=>{if(x[0]===route&&x[1]===market){s.add(x[2]);s.add(x[3])}});return [...s].sort((a,b)=>a==='Depot'?-1:b==='Depot'?1:natCmp(a,b))}
const billTotal=b=>b.items.reduce((s,i)=>s+(+i.amount||0),0);
const overCount=b=>b.items.filter(i=>i.type==='trip'&&i.chart!=null&&i.amount>i.chart).length;

/* ===== sheet ===== */
function openSheet(title,body,foot,onClose){$('shT').innerHTML=title;$('shB').innerHTML=body;$('shF').innerHTML=foot||'';$('shF').hidden=!foot;$('sheet').classList.add('show');$('sheetBg').classList.add('show');S.onClose=onClose;$('shB').scrollTop=0}
function closeSheet(){$('sheet').classList.remove('show');$('sheetBg').classList.remove('show');const f=S.onClose;S.onClose=null;if(f)f()}
$('shX').onclick=closeSheet;$('sheetBg').onclick=closeSheet;
const S={view:'start',bill:null,onClose:null};

/* ===== routing ===== */
function render(){indexFares();
  if(!D.setup)return viewWelcome();
  if(!D.heroId||!ME())return viewPick();
  if(S.view==='edit'&&S.bill)return viewEdit();
  if(S.view==='target')return viewTarget();
  if(S.view==='home')return viewHome();
  return viewStart()}

/* ===== welcome / setup ===== */
function viewWelcome(){
  $('app').innerHTML=`<div class="hero-top"><div class="lg"><img src="${LOGO}"></div><h1 class="bn">হিরো বিল</h1><p>Hero Bill · ডেলিভারি হিরোদের যাতায়াত বিল</p></div>
  <div class="card float"><h2>${L('শুরু করুন','Get started')}</h2><p class="lead bn">ম্যানেজার আপনাকে যে সেটআপ ফাইল বা কোড পাঠিয়েছেন, সেটি এখানে খুলুন।<br><span class="en">Open the setup file or code your manager sent you.</span></p>
    <div class="stack"><button class="btn primary" id="bFile">📂 ${L('সেটআপ ফাইল খুলুন','Open setup file')}</button>
    <button class="btn ghost" id="bCode">📋 ${L('কোড পেস্ট করুন','Paste code')}</button><div class="err" id="wErr"></div></div></div>
  <div class="foottxt">Hero Bill v1.0 · Designed by: ABM Shafiquzzaman</div>`;
  $('bFile').onclick=()=>$('fSetup').click();$('bCode').onclick=pasteSetup;
}
$('fSetup').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const t=await f.text();const c=findCodes(t,'HS');await applySetup(c.length?await unpackCode(c[0]):JSON.parse(t))}catch(err){setErr('ফাইলটি পড়া যায়নি (Could not read the file)')}};
function setErr(m){const e=$('wErr');if(e)e.textContent=m;else toast(m)}
function pasteSetup(){openSheet(L('কোড পেস্ট করুন','Paste code'),`<p class="bn" style="margin:0;color:var(--ink2)">হোয়াটসঅ্যাপ মেসেজটি কপি করে নিচে পেস্ট করুন। <span class="en">(Copy the WhatsApp message and paste it below.)</span></p><textarea class="code" id="pc" placeholder="HS1.…"></textarea><div class="err" id="pcErr"></div>`,
  `<button class="btn primary" id="pcGo">${L('ঠিক আছে','OK')}</button>`);
  $('pcGo').onclick=async()=>{const c=findCodes($('pc').value,'HS');if(!c.length){$('pcErr').textContent='কোড পাওয়া যায়নি (No code found)';return}try{await applySetup(await unpackCode(c[0]));closeSheet()}catch(e){$('pcErr').textContent='কোডটি সঠিক নয় (Invalid code)'}}}
async function applySetup(s){
  if(!s||s.t!=='HBSETUP'||!verifyObj(s)){setErr('এটি সঠিক সেটআপ নয় (Not a valid setup file)');return}
  const had=!!D.setup;D.setup=s;if(D.heroId&&!s.heroes.some(h=>h.id===D.heroId))D.heroId=null;save();indexFares();
  toast(had?'✅ সেটআপ আপডেট হয়েছে (Setup updated)':'✅ সেটআপ সম্পন্ন (Setup done)');S.view='start';render()}

/* ===== pick hero + PIN ===== */
function viewPick(){
  const hs=D.setup.heroes.slice().sort((a,b)=>natCmp(a.name,b.name));
  $('app').innerHTML=`<div class="hero-top" style="padding-bottom:64px"><div class="lg"><img src="${LOGO}"></div><h1 class="bn">স্বাগতম!</h1><p>${esc(D.setup.depot)} · Welcome</p></div>
  <div class="card float">${demoBar()}<h2>${L('আপনার নাম বাছুন','Choose your name')}</h2><p class="lead"></p>
    <div class="plist">${hs.map(h=>`<button class="pitem" data-h="${h.id}"><span class="av">${esc(initials(h.name))}</span><span><b>${esc(h.name)}</b><small>${esc(h.code)}</small></span></button>`).join('')}</div></div>
  <div class="foottxt"><button class="link" id="bUpd">🔄 ${L('সেটআপ আপডেট','Update setup')}</button></div>`;
  document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>viewPin(D.setup.heroes.find(h=>h.id===b.dataset.h)));
  $('bUpd').onclick=updateSetupMenu;bindDemoBar()}
function viewPin(h){let pin='';
  $('app').innerHTML=`<div class="hdr"><button class="hbtn" id="pBack">‹</button><div class="tt"><b class="bn">পিন দিন</b><small>Enter your PIN</small></div></div>
  <div class="pinwrap"><div class="av">${esc(initials(h.name))}</div><b style="font-size:17px">${esc(h.name)}</b><div class="en">${esc(h.code)}</div>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div><div class="err" id="pErr" style="text-align:center"></div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button class="fn" id="pForgot"><span class="bn">ভুলে গেছি</span></button><button data-n="0">0</button><button class="fn" data-n="del">⌫</button></div></div>`;
  const draw=()=>document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('f',i<pin.length));
  document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{const n=b.dataset.n;if(n==='del')pin=pin.slice(0,-1);else if(pin.length<4)pin+=n;draw();vibe(8);

/* ===== collection target (from manager's receivable) ===== */
const tgN=s=>String(s||'').toLowerCase().replace(/\b(bazar|bazaar|market|hat|haat|road|more|mor)\b/g,' ').replace(/[^a-z0-9ঀ-৿]+/g,' ').replace(/\s+/g,' ').trim();
function myTarget(){const me=ME();const T=D.tgt;if(!T||!me||T.depot&&D.setup&&normKey(T.depot)!==normKey(D.setup.depot))return null;
  const rs=(T.heroes&&T.heroes[me.id])||(me.routes||[]).filter(r=>T.routes[r]);const rows=[];
  for(const r of rs)for(const x of (T.routes[r]||[]))rows.push({route:r,code:x[0],name:x[1],phone:x[2],mk:x[3]||x[4]||'—',hbMk:x[3],rwMk:x[4],amt:x[5],inv:x[6],days:x[7],addr:x[8],invNo:x[9]});
  const age=Math.round((new Date(todayISO())-new Date(T.date))/864e5);return {T,rows,age,old:age>3}}
function colMap(d){D.col=D.col||{};return D.col[d||todayISO()]||{}}
function colTotal(d){return Object.values(colMap(d)).reduce((s,v)=>s+(+v||0),0)}
function setCol(code,amt){const d=todayISO();D.col=D.col||{};const m=D.col[d]=D.col[d]||{};if(amt>0)m[code]=Math.round(amt);else delete m[code];
  const b=D.bills.find(x=>x.heroId===D.heroId&&x.date===d);if(b&&b.status==='sent')b.changed=true;
  for(const k of Object.keys(D.col))if(k<iso(new Date(Date.now()-45*864e5)))delete D.col[k];save()}
/* market → target, for highlighting inside the billing steps */
function tgtIndex(route){const t=myTarget();const m=new Map();if(!t||t.old)return m;
  for(const r of t.rows){if(route&&r.route!==route)continue;for(const k of new Set([tgN(r.hbMk),tgN(r.rwMk)]))if(k){const o=m.get(k)||{amt:0,n:0};o.amt+=r.amt;o.n++;m.set(k,o)}}return m}
const kfmtB=v=>v>=1e5?(v/1e5).toFixed(1).replace(/\.0$/,'')+'L':v>=1e3?(v/1e3).toFixed(1).replace(/\.0$/,'')+'k':String(Math.round(v));
function tgtBadge(idx,name){const o=idx.get(tgN(name));return o?`<em class="tgb">🎯 ৳${kfmtB(o.amt)}<small> · ${o.n}</small></em>`:''}
async function applyTarget(o){if(!o||o.t!=='HBTGT'||!verifyObj(o)){toast('টার্গেট সঠিক নয় (Not a valid target)');return}
  if(D.setup&&o.depot&&normKey(o.depot)!==normKey(D.setup.depot)){toast('অন্য ডিপোর টার্গেট (Target is for another depot)');return}
  D.tgt=o;save();const t=myTarget();toast(t&&t.rows.length?`🎯 টার্গেট এসেছে · ${t.rows.length} দোকান (Target received)`:'🎯 টার্গেট এসেছে — আপনার রুটে কিছু নেই (No shops on your routes)');
  if(D.heroId&&ME()){S.view='target';S.tq='';render()}}
async function tgtFromLink(){const m=location.hash.match(/tgt=([A-Za-z0-9_.\-]+)/);if(!m)return;history.replaceState(null,'',location.pathname+location.search);
  try{await applyTarget(await unpackCode(m[1]))}catch(e){toast('টার্গেট লিংক সঠিক নয় (Target link not valid)')}}

    <div class="foottxt">Hero Bill v1.0 · Designed by: ABM Shafiquzzaman</div></div>
    <div class="fabw"><button class="fab2" id="fabAdd" aria-label="Add"><span class="pl2">＋</span><span class="fl"><span class="bn">${tb?'যাত্রা যোগ':'বিল লিখুন'}</span><small>${tb?'Add trip':'Add bill'}</small></span></button></div>`;
  bindHeader();bindDemoBar();

  $('bOther').onclick=()=>openSheet(L('তারিখ বাছুন','Choose date'),`<input type="date" class="txt" id="od" value="${iso(new Date(Date.now()-864e5))}" max="${t}">`,`<button class="btn primary" id="odGo">${L('ঠিক আছে','OK')}</button>`)||($('odGo').onclick=()=>{const d=$('od').value;if(!d)return;closeSheet();const ex=mine.find(b=>b.date===d);ex?openBill(ex.id):newBill(d)});
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openBill(b.dataset.open));
  document.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>shareSheet(D.bills.find(x=>x.id===b.dataset.share)))}
function histHtml(list){if(!list.length)return `<div class="emptyt"><div class="e">🧾</div><div class="bn">এখনো কোনো বিল নেই</div><div class="en">No bills yet</div></div>`;
  const g=new Map();for(const b of list){const k=b.date.slice(0,7);if(!g.has(k))g.set(k,[]);g.get(k).push(b)}
  return [...g.entries()].map(([k,bs])=>{const lbl=new Date(k+'-01T00:00:00');const tot=bs.reduce((s,b)=>s+billTotal(b),0);
    return `<div class="mhead"><span><b class="bn">${lbl.toLocaleDateString('bn-BD',{month:'long'})}</b> <span class="en">${lbl.toLocaleDateString('en-GB',{month:'short',year:'numeric'})}</span></span><span class="num">${bs.length} · <b>${tk(tot)}</b></span></div>`+
      bs.map(b=>{const st=b.status==='sent'?(b.changed?'changed':'sent'):'draft';const oc=overCount(b);return `<button class="hitem" data-open="${b.id}"><span class="dt"><b>${dayNum(b.date)}</b><small>${monShort(b.date)}</small></span>
      <span class="mid"><b>${esc(b.route)}</b><small>${b.sample?'🧪 ':''}${b.items.length} items${oc?` · <span style="color:var(--bad)">⚠ ${oc}</span>`:''} · <span class="chip ${st}" style="padding:0 7px;font-size:11px">${st==='sent'?'Sent':st==='changed'?'Changed':'Draft'}</span></small></span><span class="amt num">${tk(billTotal(b))}</span></button>`}).join('')}).join('')}
function newBill(date,addTrip){const rs=myRoutes();const b={id:uid(),heroId:D.heroId,date,route:rs.length===1?rs[0]:'',items:[],status:'draft',updatedAt:Date.now()};D.bills.push(b);save();S.bill=b;S.view='edit';render();if(addTrip&&b.route)setTimeout(()=>tripSheet(),220)}
function openBill(id,addTrip){S.bill=D.bills.find(b=>b.id===id);S.view='edit';render();if(addTrip){if(S.bill.route)setTimeout(()=>tripSheet(),220);else toast('আগে রুট বাছুন (Choose a route first)')}}

    <div class="addrow"><button class="btn primary" id="bAdd">🛺 ${L('যাত্রা যোগ করুন','Add trip')}</button><button class="btn soft" id="bExp">➕ ${L('অন্যান্য খরচ','Other cost')}</button></div>

    <div style="display:flex;justify-content:center;margin-top:16px"><button class="link" id="bDel" style="color:var(--bad)">🗑 ${L('এই বিল মুছুন','Delete this bill')}</button></div>

  bindHeader();
  document.querySelectorAll('[data-route]').forEach(x=>x.onclick=()=>{if(b.items.some(i=>i.type==='trip')&&b.route!==x.dataset.route){toast('রুট বদলাতে আগে যাত্রা মুছুন (Remove trips to change route)');return}b.route=x.dataset.route;touchBill();render()});
  $('bAdd').onclick=()=>{if(!b.route){toast('আগে রুট বাছুন (Choose a route first)');vibe(40);return}tripSheet()};
  $('bExp').onclick=()=>expenseSheet();
  $('bSend').onclick=()=>confirmSend();

  document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>{const it=b.items[+x.dataset.edit];it.type==='trip'?tripSheet(+x.dataset.edit):expenseSheet(+x.dataset.edit)});
  document.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{b.items.splice(+x.dataset.del,1);touchBill();render();toast('মুছে ফেলা হয়েছে (Removed)')});
  document.querySelectorAll('[data-ret]').forEach(x=>x.onclick=()=>{const it=b.items[+x.dataset.ret];const c=chart(b.route,it.market,it.to,it.from);tripSheet(null,{market:it.fromMarket||it.market,...(it.fromMarket?{fromMarket:it.market}:{}),from:it.to,to:it.from,mode:it.mode,amount:c!=null?c:it.amount,km:kmGuess(b.route,it.to,it.from)||it.km})})}
function tripCard(it,i){
  if(it.type!=='trip'){const c=catOf(it.cat);return `<div class="card trip"><div class="ic">🧾</div><div class="mid"><div class="route bn">${esc(c.bn)} <span class="en">(${esc(c.en)})</span></div><div class="meta">${esc(it.note||'')}</div>
    <div class="tacts"><button data-edit="${i}">✏️ বদলান</button><button data-del="${i}">🗑</button></div></div><div class="r"><div class="amt num">${tk(it.amount)}</div><div class="ch">চার্টে নেই</div></div></div>`}
  const m=modeOf(it.mode);const over=it.chart!=null&&it.amount>it.chart;const none=it.chart==null;
  return `<div class="card trip ${over||none?'warn':''}"><div class="ic">${m.ic}</div><div class="mid"><div class="route">${esc(it.from)} → ${esc(it.to)}</div><div class="meta">${it.fromMarket?`${esc(it.fromMarket)} → `:''}${esc(it.market)}${it.fromMarket?' 🔀':''} · <span class="bn">${m.bn}</span>${it.km>0?` · ${fmt(it.km,1)} km`:''}</div>
    ${it.reason?`<div class="why">💬 ${esc(it.reason)}</div>`:''}
    <div class="tacts"><button data-ret="${i}">↩ <span class="bn">ফিরতি</span></button><button data-edit="${i}">✏️ <span class="bn">বদলান</span></button><button data-del="${i}">🗑</button></div></div>
    <div class="r"><div class="amt num">${tk(it.amount)}</div><div class="ch">${none?'চার্টে নেই':'চার্ট '+tk(it.chart)}</div>${over?`<div class="over">+${fmt(it.amount-it.chart)} বেশি</div>`:''}</div></div>`}
function touchBill(){const b=S.bill;b.updatedAt=Date.now();if(b.status==='sent')b.changed=true;save()}

/* ===== trip sheet ===== */
function tripSheet(idx,preset,startStep){
  const b=S.bill;const ed=idx!=null?b.items[idx]:null;
  const last=b.items.filter(i=>i.type==='trip').slice(-1)[0];
  const ms=markets(b.route);const src=ed||preset||{};
  const st={market:src.market||(last&&last.market)||ms[0]||'',from:src.from||(last?last.to:'')||'',to:src.to||'',mode:src.mode||(last&&last.mode)||'cng',amount:src.amount,km:src.km,q:'',other:false};
  st.toMk=src.market&&src.fromMarket?src.market:st.market; if(src.fromMarket)st.market=src.fromMarket;
  const toMk=()=>st.toMk||st.market;
  if(!st.from){const d=locs(b.route,st.market).find(x=>/depot|ডিপো/i.test(x));if(d)st.from=d}
  const steps=[...(ms.length>1?['market']:[]),'from','to','mode','fare'];
  const NAMES={market:['বাজার','Market'],from:['কোথা থেকে','From'],to:['কোথায়','To'],mode:['যানবাহন','Transport'],fare:['ভাড়া','Fare']};
  let si=startStep?steps.indexOf(startStep):ed||src.to?steps.indexOf('fare'):(!last&&ms.length>1?0:st.from?steps.indexOf('to'):steps.indexOf('from'));
  if(si<0)si=0;
  const bnNum=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
  const chartNow=()=>st.from&&st.to?chart(b.route,toMk(),st.from,st.to):null;
  const valid=k=>k==='market'?!!st.market:k==='from'?!!st.from:k==='to'?!!st.to&&st.to!==st.from:k==='mode'?!!st.mode:true;
  const go=n=>{si=Math.max(0,Math.min(steps.length-1,n));st.q='';st.other=false;if(steps[si]==='fare'&&(st.amount==null||st.amount==='')){const c=chartNow();if(c!=null)st.amount=c}if(steps[si]==='fare'&&(st.km==null||st.km===''))st.km=kmGuess(b.route,st.from,st.to);draw()};
  const next=()=>{if(!valid(steps[si])){toast(`${NAMES[steps[si]][0]} বাছুন (Choose ${NAMES[steps[si]][1]})`);vibe(40);return}go(si+1)};
  const progress=()=>`<div class="wz">${steps.map((k,i)=>`<button class="wzs ${i<si?'done':i===si?'cur':''}" data-step="${i}" ${i>si&&!steps.slice(0,i).every(valid)?'disabled':''}><i>${i<si?'✓':bnNum(i+1)}</i><span class="bn">${NAMES[k][0]}</span></button>`).join('')}</div>
    <div class="wzsum">${st.from?`<b>${esc(st.from)}</b>`:'<span class="en">From?</span>'} → ${st.to?`<b>${esc(st.to)}</b>`:'<span class="en">To?</span>'} <span class="en">· ${esc(st.market)}${toMk()!==st.market?' → '+esc(toMk()):''}${steps[si]==='fare'||si>steps.indexOf('mode')?' · '+modeOf(st.mode).en:''}</span></div>`;
  const placeList=kind=>{const mk=kind==='to'?toMk():st.market;const all=locs(b.route,mk).filter(l=>kind==='from'||l!==st.from);const q=normKey(st.q);
    let list=all.filter(l=>!q||normKey(l).includes(q));
    if(kind==='to'){list=list.map(l=>({l,f:chart(b.route,mk,st.from,l)}));list.sort((x,y)=>(x.f==null)-(y.f==null)||natCmp(x.l,y.l))}else list=list.map(l=>({l,f:null}));
    const cur=kind==='from'?st.from:st.to;
    const TI=tgtIndex(b.route);
    let out=list.map(x=>`<button class="pl ${cur===x.l?'on':''} ${TI.has(tgN(x.l))?'tgt':''}" data-pick="${esc(x.l)}"><span>${esc(x.l)}${tgtBadge(TI,x.l)}</span>${x.f!=null?`<b class="num">${tk(x.f)}</b>`:kind==='to'?'<small class="en">no chart</small>':''}</button>`).join('');
    /* while searching "to", also show matching places in the route's other markets */
    let extra=[];if(kind==='to'&&q)for(const m2 of ms)if(m2!==mk)for(const l of locs(b.route,m2))if(l!==st.from&&normKey(l).includes(q)&&!list.some(x=>x.l===l))extra.push({l,m2,f:chart(b.route,m2,st.from,l)});
    if(extra.length)out+=`<div class="xmh">🔀 <span class="bn">অন্য বাজারে পাওয়া গেছে</span> <small class="en">(Found in other markets)</small></div>`+extra.map(x=>`<button class="pl" data-pick="${esc(x.l)}" data-pmk="${esc(x.m2)}"><span>${esc(x.l)}<small class="xmk">${esc(x.m2)}</small></span>${x.f!=null?`<b class="num">${tk(x.f)}</b>`:'<small class="en">no chart</small>'}</button>`).join('');
    return out+(list.length||extra.length?'':`<div class="emptyt" style="padding:16px"><span class="bn">পাওয়া যায়নি</span> <span class="en">(Not found)</span></div>`)};
  const draw=()=>{const k=steps[si];let body=progress();
    const TI=tgtIndex(b.route);
    if(k==='market')body+=`<div class="lab">${L('বাজার বাছুন','Choose market')}</div><div class="plist2">${ms.map(m=>`<button class="pl ${st.market===m?'on':''} ${TI.has(tgN(m))?'tgt':''}" data-mk="${esc(m)}"><span>${esc(m)}${tgtBadge(TI,m)}</span><small class="en">${locs(b.route,m).length} places</small></button>`).join('')}</div>`;
    if(k==='from'||k==='to'){const n=locs(b.route,k==='to'?toMk():st.market).length;
      body+=`<div class="lab">${k==='from'?L('কোথা থেকে যাত্রা শুরু?','Where did the trip start?'):L('কোথায় গেলেন?','Where did you go?')}</div>
      ${k==='to'&&ms.length>1?`<div class="xmbar"><span class="xml">🏪 <span class="bn">কোন বাজারে?</span> <small class="en">(Which market?)</small></span><div class="xmchips">${ms.map(m2=>`<button class="xmc ${toMk()===m2?'on':''}" data-tomk="${esc(m2)}">${m2===st.market?'📍 ':'🔀 '}${esc(m2)}${m2===st.market?' <small class="en">(this)</small>':''}${tgtBadge(TI,m2)}</button>`).join('')}</div></div>`:''}
      ${n>6?`<div class="srch"><span>🔍</span><input id="wq" placeholder="খুঁজুন (Search) — ${n} places" value="${esc(st.q)}" autocomplete="off"></div>`:''}
      <div class="plist2" id="wList">${placeList(k)}</div>
      ${st.other?`<div class="otherbox"><input class="txt" id="wOther" placeholder="জায়গার নাম লিখুন (Type place name)"><button class="btn primary sm" id="wOtherOk">${L('ঠিক','OK')}</button></div>`
        :`<button class="pl dashed" id="wOtherBtn">✍ <span class="bn">তালিকায় নেই — অন্য জায়গা</span> <small class="en">(Not in list)</small></button>`}`}
    if(k==='mode')body+=`<div class="lab">${L('কিসে গেলেন?','How did you travel?')}</div><div class="modes">${MODES.map(m=>`<button class="mode ${st.mode===m.k?'on':''}" data-md="${m.k}"><span class="e">${m.ic}</span><span class="bn">${m.bn}</span><small>${m.en}</small></button>`).join('')}</div>`;
    if(k==='fare'){const c=chartNow();const amt=st.amount==null?'':st.amount;
      body+=`<div class="lab">${L('কত টাকা ভাড়া দিলেন?','How much was the fare?')}</div>
      <div class="fare"><label class="in"><span>৳</span><input id="fAmt" type="number" inputmode="numeric" min="0" value="${amt}" placeholder="0"></label>
      <div class="chartbox"><small class="bn">চার্ট (Chart)</small><b class="num">${c==null?'—':fmt(c)}</b></div></div><div id="fMsg">${fareMsg(c,amt)}</div>
      <div class="kmrow" id="kmRow"><span>📏 <span class="bn">দূরত্ব</span> <small class="en">(Distance)</small> <b class="req">*</b></span><label class="kmin"><input id="fKm" type="number" inputmode="decimal" step="0.1" min="0" value="${st.km==null?'':st.km}" placeholder="0.0"><span>km</span></label></div>`}
    $('shB').innerHTML=body;
    const isNew=!ed;
    $('shF').innerHTML=k==='fare'
      ?`<button class="btn ghost" id="wBack" style="flex:0 0 auto;width:auto">‹</button>${isNew?`<button class="btn soft" id="wAddNext">➕ ${L('যোগ করে পরের যাত্রা','Add & next trip')}</button>`:''}<button class="btn primary" id="wSave">✔ ${isNew?L('যোগ করুন','Add'):L('সেভ','Save')}</button>`
      :`${si>0?`<button class="btn ghost" id="wBack">‹ ${L('পেছনে','Back')}</button>`:''}<button class="btn primary" id="wNext" ${valid(k)?'':'disabled'}>${L('পরের ধাপ','Next')} ›</button>`;
    $('shF').hidden=false;$('shB').scrollTop=0;
    $('shB').querySelectorAll('[data-step]').forEach(x=>x.onclick=()=>go(+x.dataset.step));
    $('shB').querySelectorAll('[data-mk]').forEach(x=>x.onclick=()=>{if(st.market!==x.dataset.mk){st.market=x.dataset.mk;st.toMk=st.market;st.to='';st.amount=null;if(!locs(b.route,st.market).includes(st.from)){const d=locs(b.route,st.market).find(l=>/depot|ডিপো/i.test(l));st.from=d||''}}vibe(8);go(si+1)});
    const bindPicks=()=>$('shB').querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>{const v=x.dataset.pick;if(k==='from'){st.from=v;if(st.to===v)st.to=''}else{st.to=v;if(x.dataset.pmk)st.toMk=x.dataset.pmk}st.amount=null;st.km=null;vibe(8);go(si+1)});
    $('shB').querySelectorAll('[data-tomk]').forEach(x=>x.onclick=()=>{st.toMk=x.dataset.tomk;st.to='';st.q='';st.amount=null;vibe(8);draw()});
    bindPicks();
    if($('wq'))$('wq').oninput=e=>{st.q=e.target.value;$('wList').innerHTML=placeList(k);bindPicks()};
    if($('wOtherBtn'))$('wOtherBtn').onclick=()=>{st.other=true;draw();setTimeout(()=>$('wOther').focus(),50)};
    if($('wOtherOk')){const ok=()=>{const v=$('wOther').value.trim();if(v.length<2){toast('জায়গার নাম লিখুন (Type the place)');return}if(k==='from')st.from=v;else st.to=v;st.amount=null;go(si+1)};$('wOtherOk').onclick=ok;$('wOther').onkeydown=e=>{if(e.key==='Enter')ok()}}
    $('shB').querySelectorAll('[data-md]').forEach(x=>x.onclick=()=>{st.mode=x.dataset.md;vibe(8);go(si+1)});
    if($('fKm'))$('fKm').oninput=e=>{st.km=e.target.value;$('kmRow').classList.toggle('need',!(+e.target.value>0))};
    if($('fAmt')){const c=chartNow();$('fAmt').oninput=e=>{st.amount=e.target.value;$('fMsg').innerHTML=fareMsg(c,e.target.value)};setTimeout(()=>{try{$('fAmt').focus();$('fAmt').select()}catch(e){}},80)}
    if($('wBack'))$('wBack').onclick=()=>go(si-1);
    if($('wNext'))$('wNext').onclick=next;
    if($('wSave'))$('wSave').onclick=()=>save(false);
    if($('wAddNext'))$('wAddNext').onclick=()=>save(true);
  };
  const save=chain=>{
    const from=(st.from||'').trim(),to=(st.to||'').trim(),amount=Math.round(+st.amount);
    if(!from||!to){toast('কোথা থেকে ও কোথায় বাছুন (Choose From and To)');go(steps.indexOf(!from?'from':'to'));return}
    if(from===to){toast('দুটি জায়গা আলাদা হতে হবে (Places must differ)');go(steps.indexOf('to'));return}
    if(st.amount===''||st.amount==null||!(amount>=0)){toast('ভাড়া লিখুন (Enter fare)');$('fAmt').focus();return}
    const kmv=+st.km;if(!(kmv>0)||kmv>300){toast(kmv>300?'দূরত্ব ঠিক করুন — ৩০০ কিমি এর বেশি (Check distance — over 300 km)':'দূরত্ব লিখুন — কত কিমি? (Enter distance in km)');vibe(40);const r=$('kmRow');if(r){r.classList.add('need');r.scrollIntoView({block:'center'})}const f=$('fKm');if(f)f.focus();return}
    const dm=toMk();const c=chart(b.route,dm,from,to);
    const km=Math.round((+st.km||0)*10)/10;
    const item={type:'trip',market:dm,from,to,mode:st.mode,amount,chart:c,reason:''};if(dm!==st.market)item.fromMarket=st.market;if(km>0){item.km=km;D.kmMem=D.kmMem||{};D.kmMem[kmKey(b.route,from,to)]=km}
    const commit=reason=>{item.reason=reason||'';if(ed)b.items[idx]=item;else b.items.push(item);touchBill();closeSheet();render();vibe(15);
      toast(ed?'✔ সেভ হয়েছে (Saved)':`✔ যাত্রা ${bnNum(b.items.filter(i=>i.type==='trip').length)} যোগ হয়েছে (Trip added)`);
      if(chain)setTimeout(()=>tripSheet(null,{market:item.market,from:item.to,mode:item.mode},'to'),280)};
    if(c==null)return reasonSheet('none',null,amount,commit,ed&&ed.reason);
    if(amount>c)return reasonSheet('over',c,amount,commit,ed&&ed.reason);
    commit('')};
  openSheet(ed?L('যাত্রা বদলান','Edit trip'):L('যাত্রা যোগ করুন','Add trip'),'','x');draw();
}
function fareMsg(c,a){a=+a;if(c==null)return `<div class="fwarn none">ℹ️ <span><span class="bn">এই যাত্রা চার্টে নেই — কারণ লিখতে হবে।</span> <span class="en">(Not in fare chart — a reason is needed.)</span></span></div>`;
  if(a>c)return `<div class="fwarn over">⚠️ <span><span class="bn">চার্টের চেয়ে ৳${fmt(a-c)} বেশি।</span> <span class="en">(৳${fmt(a-c)} more than chart)</span></span></div>`;
  if(a&&a<=c)return `<div class="fwarn ok">✔ <span class="bn">চার্ট অনুযায়ী ঠিক আছে</span> <span class="en">(Within chart)</span></div>`;return ''}
const REASONS=[['রাস্তা বন্ধ / ঘুরপথ','Road closed / detour'],['বৃষ্টি','Rain'],['রাতের ভাড়া','Night fare'],['বেশি মাল','Extra load'],['যানবাহন পাওয়া যায়নি','No regular transport'],['নতুন দোকান / জায়গা','New shop / place']];
function reasonSheet(kind,c,amount,commit,prev){
  let pick=prev||'';
  const body=()=>`<div class="fwarn ${kind==='over'?'over':'none'}" style="font-size:15px">${kind==='over'?`⚠️ <span><b class="bn">চার্টের চেয়ে ৳${fmt(amount-c)} বেশি</b><br><span class="en">You entered ${tk(amount)} — chart is ${tk(c)}. Are you sure?</span></span>`:`ℹ️ <span><b class="bn">এই যাত্রা ভাড়ার চার্টে নেই</b><br><span class="en">This trip is not in the fare chart. Please give a reason.</span></span>`}</div>
    <div><div class="lab">${L('কারণ বাছুন','Choose reason')}</div><div class="chips">${REASONS.map(([bn,en])=>{const v=`${bn} (${en})`;return `<button class="c ${pick===v?'on':''}" data-rs="${esc(v)}"><span class="bn">${bn}</span><small>${en}</small></button>`}).join('')}</div></div>
    <div><div class="lab">${L('অথবা নিজে লিখুন','Or write it')}</div><input class="txt" id="rsT" placeholder="কারণ লিখুন (Write reason)" value="${esc(REASONS.some(([bn,en])=>pick===`${bn} (${en})`)?'':pick)}"></div>`;
  openSheet(kind==='over'?L('নিশ্চিত তো?','Are you sure?'):L('কারণ লিখুন','Reason needed'),body(),`<button class="btn ghost" id="rsNo">${L('ফিরে যান','Go back')}</button><button class="btn primary" id="rsYes">${L('হ্যাঁ, নিশ্চিত','Yes, confirm')}</button>`);
  const bind=()=>{$('shB').querySelectorAll('[data-rs]').forEach(x=>x.onclick=()=>{pick=x.dataset.rs;$('shB').innerHTML=body();bind()});$('rsT').oninput=e=>{pick=e.target.value}};bind();
  $('rsNo').onclick=()=>{closeSheet();toast('যাত্রা যোগ হয়নি (Not added)')};
  $('rsYes').onclick=()=>{const r=(pick||'').trim();if(r.length<2){toast('কারণ বাছুন বা লিখুন (Choose or write a reason)');vibe(40);return}commit(r)}}

/* ===== other expense ===== */
function expenseSheet(idx){
  const b=S.bill;const ed=idx!=null?b.items[idx]:null;const st={cat:(ed&&ed.cat)||'labour',amount:ed?ed.amount:'',note:ed?ed.note:''};
  const draw=()=>{$('shB').innerHTML=`<div><div class="lab">${L('খরচের ধরন','Type')}</div><div class="chips">${OTHER_CATS.map(c=>`<button class="c ${st.cat===c.k?'on':''}" data-ct="${c.k}"><span class="bn">${c.bn}</span><small>${c.en}</small></button>`).join('')}</div></div>
    <div><div class="lab">${L('টাকা','Amount')}</div><div class="fare"><label class="in"><span>৳</span><input id="xA" type="number" inputmode="numeric" min="0" value="${st.amount}" placeholder="0"></label></div></div>
    <div><div class="lab">${L('বিবরণ','Details')}</div><input class="txt" id="xN" placeholder="কেন খরচ হলো? (Why?)" value="${esc(st.note)}"></div>
    <div class="fwarn none">ℹ️ <span class="bn">অন্যান্য খরচ ম্যানেজার আলাদাভাবে দেখবেন। <span class="en">(The manager reviews other costs separately.)</span></span></div>`;
    $('shB').querySelectorAll('[data-ct]').forEach(x=>x.onclick=()=>{st.cat=x.dataset.ct;st.amount=$('xA').value;st.note=$('xN').value;draw()})};
  openSheet(L('অন্যান্য খরচ','Other cost'),'',`<button class="btn primary" id="xSave">✔ ${ed?L('সেভ','Save'):L('যোগ করুন','Add')}</button>`);draw();
  $('xSave').onclick=()=>{const a=Math.round(+$('xA').value);const n=$('xN').value.trim();if(!(a>0)){toast('টাকা লিখুন (Enter amount)');return}if(n.length<2){toast('বিবরণ লিখুন (Write details)');return}
    const item={type:'other',cat:st.cat,amount:a,note:n};if(ed)b.items[idx]=item;else b.items.push(item);touchBill();closeSheet();render();toast('✔ খরচ যোগ হয়েছে (Added)')}}

function confirmSend(){
  const b=S.bill;const trips=b.items.filter(i=>i.type==='trip');const oth=b.items.filter(i=>i.type!=='trip');const oc=overCount(b);
  openSheet(L('বিল নিশ্চিত করুন','Confirm bill'),`<div class="card" style="padding:6px 14px">

      <div class="sumrow"><span>${L('যাত্রা','Trips')}</span><b class="num">${trips.length} · ${tk(trips.reduce((s,i)=>s+i.amount,0))}</b></div>
      ${oth.length?`<div class="sumrow"><span>${L('অন্যান্য খরচ','Other costs')}</span><b class="num">${oth.length} · ${tk(oth.reduce((s,i)=>s+i.amount,0))}</b></div>`:''}
      <div class="sumrow" style="font-size:17px"><span>${L('মোট','Total')}</span><b class="num">${tk(billTotal(b))}</b></div></div>
    ${oc?`<div class="fwarn over">⚠️ <span>${oc}টি যাত্রা চার্টের চেয়ে বেশি, কারণসহ পাঠানো হবে। <span class="en">(${oc} trip(s) above chart will be sent with your reasons.)</span></span></div>`:'<div class="fwarn ok">✔ <span class="bn">সব যাত্রা চার্ট অনুযায়ী</span> <span class="en">(All trips within chart)</span></div>'}
    <p class="bn" style="margin:0;color:var(--ink2);font-size:14px">সেভ করার পর ম্যানেজারকে পাঠান। <span class="en">(After saving, send it to your manager.)</span></p>`,
    `<button class="btn ghost" onclick="closeSheet()">${L('ফিরে যান','Back')}</button><button class="btn okb" id="cfYes">✅ ${L('সেভ করুন','Save')}</button>`);
  $('cfYes').onclick=()=>{b.status='sent';b.changed=false;b.sentAt=Date.now();save();closeSheet();setTimeout(()=>shareSheet(b,true),220)}}
function buildPayload(b){const me=ME();const o={t:'HBBILL',v:1,heroId:me.id,heroCode:me.code,heroName:me.name,depot:D.setup.depot,date:b.date,route:b.route,
  items:b.items.map(i=>i.type==='trip'?{type:'trip',market:i.market,from:i.from,to:i.to,mode:i.mode,amount:i.amount,chart:i.chart,reason:i.reason||'',...(i.km>0?{km:+i.km}:{}),...(i.fromMarket?{fromMarket:i.fromMarket}:{})}:{type:'other',cat:i.cat,amount:i.amount,note:i.note||''}),
  total:billTotal(b),createdAt:b.sentAt||b.updatedAt,setupVer:D.setup.ver};
  const cm=(D.col||{})[b.date]||{};const col=Object.entries(cm).filter(x=>x[1]>0).map(([c,a])=>[c,Math.round(a)]);if(col.length)o.col=col;
  o.sig=signObj(o);return o}
function compactText(b,code){const me=ME();const oc=overCount(b);
  return `🧾 হিরো বিল (Hero Bill)\n${me.name} (${me.code})\n📅 ${enDate(b.date)} · রুট (Route): ${b.route}\n🛺 যাত্রা (Trips): ${b.items.filter(i=>i.type==='trip').length} · 💰 মোট (Total): ${tk(billTotal(b))}${oc?`\n⚠ চার্টের বেশি (Over chart): ${oc}`:''}${(()=>{const cm=(D.col||{})[b.date]||{};const v=Object.values(cm).filter(x=>x>0);return v.length?`\n💵 আদায় (Collected): ${tk(v.reduce((s,x)=>s+x,0))} · ${v.length} দোকান (shops)`:''})()}\n—\n${code}`}
async function shareSheet(b,fresh){

      <h3 class="bn">বিল সেভ হয়েছে 🎉</h3><p class="bn">এখন ম্যানেজারকে পাঠান <span class="en">(Now send it to your manager)</span></p></div>`:''}
    <div class="card" style="padding:12px 14px;display:flex;justify-content:space-between;align-items:center"><span><b>${enDate(b.date)}</b><br><small class="en">${esc(b.route)} · ${b.items.length} items</small></span><b class="num" style="font-size:20px">${tk(billTotal(b))}</b></div>
    <div class="sgrid">
      <button class="btn wa full" id="sWa"><span class="e">💬</span>${L('হোয়াটসঅ্যাপে পাঠান','Send on WhatsApp')}</button>
      ${canFile?`<button class="btn soft" id="sFile"><span class="e">📎</span>${L('ফাইল শেয়ার','Share file')}</button>`:''}
      <button class="btn ghost" id="sDl"><span class="e">⬇️</span>${L('ডাউনলোড','Download')}</button>
      <button class="btn ghost" id="sMail"><span class="e">✉️</span>${L('ইমেইল','Email')}</button>
      <button class="btn ghost" id="sCopy"><span class="e">📋</span>${L('কোড কপি','Copy code')}</button>

  $('sCopy').onclick=async()=>{try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}toast('📋 কপি হয়েছে (Copied)');markShared(b)};

(function(){

    d.style.cssText='position:fixed;inset:0;z-index:2147483647;background:rgba(20,18,60,.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;font-family:\'Hind Siliguri\',\'Ubuntu\',sans-serif';

    document.body.appendChild(d);setTimeout(()=>{const b=document.getElementById('pwaLockGo');if(b){b.style.display='';b.onclick=()=>location.reload()}},8000)};
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{

  }).catch(()=>{});

  /* install button (Android Chrome) */

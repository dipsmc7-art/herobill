<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo removed</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F7F6FB;color:#1B1850;font:18px/1.5 Arial,sans-serif;text-align:center;padding:24px}</style></head>
<body><div><h1 style="margin:0 0 8px;font-size:26px">This demo has been removed</h1><p style="margin:0;color:#4A4870">The demo data on this device has been deleted.</p></div>
<script>
try{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k.indexOf('demo:')===0)localStorage.removeItem(k)}}catch(e){}
try{['HeroBillManagerDB_demo','RouteCollectionDB_demo'].forEach(n=>indexedDB.deleteDatabase(n))}catch(e){}
if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(new URL(r.scope).pathname===location.pathname.replace(/[^/]*$/,''))r.update().catch(()=>{})}));
</script></body></html>
